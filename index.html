<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance Tracker Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
}

/* LOGIN */

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:#09111f;
padding:35px;
border-radius:25px;
box-shadow:0 0 30px cyan;
}

.login-box h1{
text-align:center;
margin-bottom:20px;
font-size:35px;
color:cyan;
}

.login-box p{
text-align:center;
color:#aaa;
margin-bottom:20px;
}

input,
select,
button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
outline:none;
border-radius:12px;
font-size:15px;
}

input,
select{
background:#111827;
color:white;
}

button{
background:cyan;
color:black;
font-weight:bold;
cursor:pointer;
}

/* DASHBOARD */

#dashboard{
display:none;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.header h1{
font-size:35px;
color:cyan;
}

.logout-btn{
width:auto;
padding:12px 20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:#09111f;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.card h2{
margin-top:10px;
font-size:30px;
}

.green{
color:#22c55e;
}

.red{
color:#ef4444;
}

.blue{
color:#3b82f6;
}

.box{
background:#09111f;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,255,255,0.2);
}

.charts{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.chart-box{
background:#09111f;
padding:20px;
border-radius:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:15px;
border-bottom:1px solid #333;
text-align:left;
}

.badge{
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.income{
background:rgba(34,197,94,0.2);
color:#22c55e;
}

.expense{
background:rgba(239,68,68,0.2);
color:#ef4444;
}

.log-box{
max-height:250px;
overflow:auto;
}

@media(max-width:700px){

.charts{
grid-template-columns:1fr;
}

.header h1{
font-size:28px;
}

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">


<h1>💸 Finance Tracker</h1>

<p>
Login dulu sebelum masuk dashboard broo😑
</p>

<input type="email"
id="email"
placeholder="Email">

<input type="password"
id="password"
placeholder="Password">

<button id="registerBtn">
Register
</button>

<button id="loginBtn">
Login
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="container">

<div class="header">

<h1>📊 Finance Dashboard</h1>

<button
class="logout-btn"
id="logoutBtn">
Logout
</button>

</div>

<!-- CARD -->

<div class="cards">

<div class="card">
<p>Total Pemasukan</p>
<h2 class="green" id="income">
Rp 0
</h2>
</div>

<div class="card">
<p>Total Pengeluaran</p>
<h2 class="red" id="expense">
Rp 0
</h2>
</div>

<div class="card">
<p>Saldo</p>
<h2 class="blue" id="balance">
Rp 0
</h2>
</div>

</div>

<!-- FORM -->

<div class="box">

<h2>➕ Tambah Transaksi</h2>

<select id="type">
<option>Pemasukan</option>
<option>Pengeluaran</option>
</select>

<input type="text"
id="category"
placeholder="Kategori">

<input type="number"
id="amount"
placeholder="Jumlah">

<input type="date"
id="date">

<button id="saveBtn">
Simpan Data
</button>

</div>

<!-- CHART -->

<div class="charts">

<div class="chart-box">
<h2>📊 Grafik Batang</h2>
<canvas id="barChart"></canvas>
</div>

<div class="chart-box">
<h2>🥧 Grafik Pie</h2>
<canvas id="pieChart"></canvas>
</div>

</div>

<div class="chart-box">

<h2>📈 Grafik Garis</h2>

<canvas id="lineChart"></canvas>

</div>

<!-- TABLE -->

<div class="box">

<h2>🧾 Riwayat Transaksi</h2>

<table>

<thead>
<tr>
<th>Tipe</th>
<th>Kategori</th>
<th>Jumlah</th>
<th>Tanggal</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<!-- LOG -->


</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyAqKECySymvivnthKmQdJbZWnHsbXkOZvo",
  authDomain: "masukkeluaruang.firebaseapp.com",
  projectId: "masukkeluaruang",
  storageBucket: "masukkeluaruang.firebasestorage.app",
  messagingSenderId: "119724087277",
  appId: "1:119724087277:web:b68aba04389c4f82eef9e4",
  measurementId: "G-6XTCD7N80H"
  
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* ELEMENT */

const loginPage =
document.getElementById('loginPage');

const dashboard =
document.getElementById('dashboard');

const incomeText =
document.getElementById('income');

const expenseText =
document.getElementById('expense');

const balanceText =
document.getElementById('balance');

const tableBody =
document.getElementById('tableBody');

const logTable =
document.getElementById('logTable');

let transactions = [];

/* CHART */

const barChart = new Chart(
document.getElementById('barChart'),
{
type:'bar',
data:{
labels:['Keuangan'],
datasets:[
{
label:'Pemasukan',
data:[0],
backgroundColor:'#22c55e'
},
{
label:'Pengeluaran',
data:[0],
backgroundColor:'#ef4444'
}
]
}
}
);

const pieChart = new Chart(
document.getElementById('pieChart'),
{
type:'pie',
data:{
labels:[],
datasets:[{
data:[],
backgroundColor:[
'#22c55e',
'#ef4444',
'#3b82f6',
'#eab308',
'#8b5cf6'
]
}]
}
}
);

const lineChart = new Chart(
document.getElementById('lineChart'),
{
type:'line',
data:{
labels:[],
datasets:[{
label:'Saldo',
data:[],
borderColor:'#3b82f6',
backgroundColor:'#3b82f6',
tension:0.4
}]
}
}
);

/* REGISTER */

document
.getElementById('registerBtn')
.addEventListener('click', async()=>{

try{

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert('Register berhasil 😎');

}catch(error){

alert(error.message);

}

});

/* LOGIN */

document
.getElementById('loginBtn')
.addEventListener('click', async()=>{

try{

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

await signInWithEmailAndPassword(
auth,
email,
password
);

await addDoc(
collection(db,'logs'),
{
user:email,
status:'LOGIN',
time:new Date().toLocaleString()
}
);

loginPage.style.display='none';
dashboard.style.display='block';

loadTransactions();
loadLogs();

}catch(error){

alert(error.message);

}

});

/* LOGOUT */

document
.getElementById('logoutBtn')
.addEventListener('click', async()=>{

await signOut(auth);

dashboard.style.display='none';
loginPage.style.display='flex';

});

/* SAVE */

document
.getElementById('saveBtn')
.addEventListener('click', async()=>{

const type =
document.getElementById('type').value;

const category =
document.getElementById('category').value;

const amount =
document.getElementById('amount').value;

const date =
document.getElementById('date').value;

if(
category==='' ||
amount==='' ||
date===''
){
alert('Isi semua data 😑');
return;
}

await addDoc(
collection(db,'transactions'),
{
type,
category,
amount:Number(amount),
date
}
);

alert('Data tersimpan');

loadTransactions();

});

/* LOAD */

async function loadTransactions(){

transactions = [];

const querySnapshot =
await getDocs(
collection(db,'transactions')
);

tableBody.innerHTML='';

querySnapshot.forEach((doc)=>{

const data = doc.data();

transactions.push(data);

tableBody.innerHTML += `
<tr>

<td>
<span class="badge ${
data.type==='Pemasukan'
?
'income'
:
'expense'
}">
${data.type}
</span>
</td>

<td>${data.category}</td>

<td>
Rp ${Number(data.amount)
.toLocaleString('id-ID')}
</td>

<td>${data.date}</td>

</tr>
`;

});

updateUI();

}

/* LOAD LOG */

async function loadLogs(){

const querySnapshot =
await getDocs(
collection(db,'logs')
);

logTable.innerHTML='';

querySnapshot.forEach((doc)=>{

const data = doc.data();

logTable.innerHTML += `
<tr>
<td>${data.user}</td>
<td>${data.status}</td>
<td>${data.time}</td>
</tr>
`;

});

}

/* UPDATE */

function updateUI(){

let income = 0;
let expense = 0;

transactions.forEach(item=>{

if(item.type==='Pemasukan'){
income += item.amount;
}else{
expense += item.amount;
}

});

const balance =
income - expense;

incomeText.innerText =
'Rp ' +
income.toLocaleString('id-ID');

expenseText.innerText =
'Rp ' +
expense.toLocaleString('id-ID');

balanceText.innerText =
'Rp ' +
balance.toLocaleString('id-ID');

updateCharts(
income,
expense
);

}

/* CHART UPDATE */

function updateCharts(
income,
expense
){

barChart.data.datasets[0]
.data=[income];

barChart.data.datasets[1]
.data=[expense];

barChart.update();

const expenseCategory = {};

transactions.forEach(item=>{

if(item.type==='Pengeluaran'){

if(!expenseCategory[item.category]){
expenseCategory[item.category]=0;
}

expenseCategory[item.category]
+= item.amount;

}

});

pieChart.data.labels =
Object.keys(expenseCategory);

pieChart.data.datasets[0]
.data =
Object.values(expenseCategory);

pieChart.update();

let saldo = 0;

const labels = [];
const data = [];

transactions.forEach(item=>{

if(item.type==='Pemasukan'){
saldo += item.amount;
}else{
saldo -= item.amount;
}

labels.push(item.date);
data.push(saldo);

});

lineChart.data.labels =
labels;

lineChart.data.datasets[0]
.data =
data;

lineChart.update();

}

/* ANIMASI ANGKA */
function animate(el,target){
let cur=0;
let step=Math.ceil(target/40);
let i=setInterval(()=>{
cur+=step;
if(cur>=target){
cur=target;
clearInterval(i);
}
el.innerText=cur.toLocaleString("id-ID");
},20);
}

let list=[];


</script>

</body>
</html>
